<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel de Integração - A Elétrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6 md:p-10 text-gray-800">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- Cabeçalho e Navegação por Abas -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-gray-200 gap-4">
            <h1 class="text-2xl font-bold text-gray-900">Painel de Integração - A Elétrica</h1>
            <div class="flex bg-gray-100 p-1 rounded-lg">
                <button onclick="mudarAba('config')" id="btnAbaConfig" class="px-5 py-2 rounded-md text-sm font-semibold transition bg-white shadow-sm text-gray-900">Configurações</button>
                <button onclick="mudarAba('produtos')" id="btnAbaProdutos" class="px-5 py-2 rounded-md text-sm font-semibold transition text-gray-500 hover:text-gray-900">Produtos</button>
            </div>
        </div>

        <!-- ABA 1: CONFIGURAÇÕES -->
        <div id="abaConfig" class="space-y-6">
            <!-- Bloco 1.1: Configuração do Bling -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-xl font-semibold text-gray-700">Credenciais do Bling (ERP)</h2>
                    <span id="badgeBling" class="px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-600">Desconectado</span>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="BLING_CLIENT_ID" placeholder="Client ID (Bling)" class="p-2.5 border rounded-lg text-sm">
                    <input type="password" id="BLING_CLIENT_SECRET" placeholder="Client Secret (Bling)" class="p-2.5 border rounded-lg text-sm">
                    <input type="text" id="BLING_REDIRECT_URI" placeholder="URL de Redirecionamento (/callback)" class="p-2.5 border rounded-lg text-sm md:col-span-2">
                </div>
                <div class="flex gap-3 pt-2">
                    <button onclick="salvarConfigBling()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800">Salvar Bling</button>
                    <button onclick="conectarBling()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-orange-700">Conectar / Autorizar Bling</button>
                </div>
            </div>

            <!-- Bloco 1.2: Configuração da Loja Virtual -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
                <div class="border-b pb-3">
                    <h2 class="text-xl font-semibold text-gray-700">Credenciais da Loja Virtual</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="LOJA_API_URL" placeholder="URL da API da Loja" class="p-2.5 border rounded-lg text-sm">
                    <input type="password" id="LOJA_API_KEY" placeholder="Chave / Token da API da Loja" class="p-2.5 border rounded-lg text-sm">
                </div>
                <div class="pt-2">
                    <button onclick="salvarConfigLoja()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800">Salvar Loja</button>
                </div>
            </div>
        </div>

        <!-- ABA 2: PRODUTOS -->
        <div id="abaProdutos" class="space-y-6 hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-center border-b pb-3 gap-4">
                    <h2 class="text-xl font-semibold text-gray-700">Gerenciamento de Produtos</h2>
                </div>
                
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4">
                    <input type="text" id="buscaProdutoBling" placeholder="Buscar por nome ou código" class="w-full sm:w-80 p-2.5 border rounded-lg text-sm" />
                    <div class="flex gap-3">
                        <button onclick="buscarPorCodigo()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">Buscar Produtos</button>
                        <button onclick="enviarSelecionados()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-700">Enviar Selecionados</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 border-b">
                            <tr>
                                <th class="p-3 w-10"><input type="checkbox" id="selectAll" onclick="toggleTodos(this)"></th>
                                <th class="p-3">SKU</th>
                                <th class="p-3">Nome do Produto</th>
                                <th class="p-3">Preço</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProdutos" class="divide-y">
                            <tr><td colspan="4" class="p-4 text-center text-gray-400">Clique em "Carregar Produtos do Bling" para listar os itens.</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="text-lg font-semibold text-gray-700">Produtos importados localmente</h3>
                        <span id="contadorImportados" class="text-sm text-gray-500">0 produtos</span>
                    </div>
                    <div id="listaImportados" class="space-y-2 text-sm text-gray-600">
                        <p class="text-gray-500">Nenhum produto importado salvo.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        let produtosGlobais = [];
        let produtosImportadosGlobais = [];

        // Controle de Abas
        function mudarAba(aba) {
            const configDiv = document.getElementById('abaConfig');
            const produtosDiv = document.getElementById('abaProdutos');
            const btnConfig = document.getElementById('btnAbaConfig');
            const btnProdutos = document.getElementById('btnAbaProdutos');

            if (aba === 'config') {
                configDiv.classList.remove('hidden');
                produtosDiv.classList.add('hidden');
                btnConfig.className = "px-5 py-2 rounded-md text-sm font-semibold transition bg-white shadow-sm text-gray-900";
                btnProdutos.className = "px-5 py-2 rounded-md text-sm font-semibold transition text-gray-500 hover:text-gray-900";
            } else {
                configDiv.classList.add('hidden');
                produtosDiv.classList.remove('hidden');
                btnProdutos.className = "px-5 py-2 rounded-md text-sm font-semibold transition bg-white shadow-sm text-gray-900";
                btnConfig.className = "px-5 py-2 rounded-md text-sm font-semibold transition text-gray-500 hover:text-gray-900";
            }
        }

        // Carregar Configurações Iniciais
        fetch('/api/config').then(r => r.json()).then(data => {
            for(let key in data) {
                if(document.getElementById(key)) document.getElementById(key).value = data[key];
            }
            if(data.temTokenBling) {
                const badge = document.getElementById('badgeBling');
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700';
                badge.innerText = 'Conectado ao Bling';
            }
        }).finally(carregarProdutosImportados);

        async function salvarConfigBling() {
            const payload = {
                BLING_CLIENT_ID: document.getElementById('BLING_CLIENT_ID').value,
                BLING_CLIENT_SECRET: document.getElementById('BLING_CLIENT_SECRET').value,
                BLING_REDIRECT_URI: document.getElementById('BLING_REDIRECT_URI').value
            };
            const res = await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            alert(data.mensagem);
        }

        async function salvarConfigLoja() {
            const payload = {
                LOJA_API_URL: document.getElementById('LOJA_API_URL').value,
                LOJA_API_KEY: document.getElementById('LOJA_API_KEY').value
            };
            const res = await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            alert(data.mensagem);
        }

        async function conectarBling() {
            const res = await fetch('/api/auth/bling');
            const data = await res.json();
            if(data.sucesso && data.url) {
                window.location.href = data.url;
            } else {
                alert('Erro ao gerar URL de autorização.');
            }
        }

        async function carregarProdutosImportados() {
            const res = await fetch('/api/produtos-importados');
            const data = await res.json();
            if(data.sucesso) {
                produtosImportadosGlobais = data.produtos || [];
                renderizarImportados();
            }
        }

        function renderizarImportados() {
            const lista = document.getElementById('listaImportados');
            const contador = document.getElementById('contadorImportados');
            if(!produtosImportadosGlobais || produtosImportadosGlobais.length === 0) {
                contador.innerText = '0 produtos';
                lista.innerHTML = '<p class="text-gray-500">Nenhum produto importado salvo.</p>';
                return;
            }

            contador.innerText = `${produtosImportadosGlobais.length} produtos`;
            lista.innerHTML = produtosImportadosGlobais.map(p => `
                <div class="py-2 border-b border-gray-100">
                    <span class="font-medium">${p.codigo || 'S/N'}</span> - ${p.nome}
                </div>
            `).join('');
        }

        async function carregarProdutos() {
            const tbody = document.getElementById('tabelaProdutos');
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Carregando produtos do Bling...</td></tr>';

            const termo = document.getElementById('buscaProdutoBling').value.trim();
            const params = new URLSearchParams();

            if (termo) {
                params.set('criterio', '5');
                params.set('tipo', `NOME=${termo}`);
            }

            const query = params.toString();
            const res = await fetch(`/api/produtos-bling${query ? '?' + query : ''}`);
            const data = await res.json();
            
            if(!data.sucesso) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Erro: ${data.erro}</td></tr>`;
                return;
            }

            produtosGlobais = data.produtos || [];
            if(produtosGlobais.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nenhum produto encontrado no Bling.</td></tr>';
                return;
            }

            renderizarProdutos(produtosGlobais);
        }

        async function buscarPorCodigo() {
            const termo = document.getElementById('buscaProdutoBling').value.trim();
            if (!termo) {
                return carregarProdutos();
            }

            const tbody = document.getElementById('tabelaProdutos');
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Carregando produtos do Bling por código...</td></tr>';

            const params = new URLSearchParams();
            params.set('criterio', '5');
            params.set('tipo', `T&codigo=${termo}`);

            const res = await fetch(`/api/produtos-bling?${params.toString()}`);
            const data = await res.json();

            if(!data.sucesso) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500">Erro: ${data.erro}</td></tr>`;
                return;
            }

            produtosGlobais = data.produtos || [];
            if(produtosGlobais.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nenhum produto encontrado no Bling.</td></tr>';
                return;
            }

            renderizarProdutos(produtosGlobais);
        }

        function renderizarProdutos(lista) {
            const tbody = document.getElementById('tabelaProdutos');
            if(!lista || lista.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Nenhum produto encontrado no Bling.</td></tr>';
                return;
            }

            tbody.innerHTML = lista.map((p, index) => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3"><input type="checkbox" class="chkProduto" value="${index}"></td>
                    <td class="p-3 font-mono text-xs">${p.codigo || 'S/N'}</td>
                    <td class="p-3 font-medium">${p.nome}</td>
                    <td class="p-3">R$ ${p.preco ? Number(p.preco).toFixed(2) : '0.00'}</td>
                </tr>
            `).join('');
        }

        function toggleTodos(master) {
            document.querySelectorAll('.chkProduto').forEach(chk => chk.checked = master.checked);
        }

        async function enviarSelecionados() {
            const checks = document.querySelectorAll('.chkProduto:checked');
            const indices = Array.from(checks).map(c => parseInt(c.value));
            
            if(indices.length === 0) {
                alert('Selecione pelo menos um produto para enviar.');
                return;
            }

            const selecionados = indices.map(i => produtosGlobais[i]);
            const produtosParaSalvar = [
                ...produtosImportadosGlobais,
                ...selecionados.filter(p => !produtosImportadosGlobais.some(item => item.codigo === p.codigo))
            ];

            const res = await fetch('/api/produtos-importados', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ produtos: produtosParaSalvar })
            });
            const data = await res.json();

            if(data.sucesso) {
                produtosImportadosGlobais = produtosParaSalvar;
                renderizarImportados();
                alert(data.mensagem);
            } else {
                alert('Erro ao salvar produtos importados: ' + (data.erro || 'Erro desconhecido.'));
            }
        }
    </script>
</body>
</html>
