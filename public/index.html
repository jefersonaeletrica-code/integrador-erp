<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrador ERP</title>
    <!-- O placeholder __CACHE_BUSTER__ será substituído dinamicamente pelo servidor -->
    <link rel="stylesheet" href="style.css?v=__CACHE_BUSTER__">
    <!-- Adicionando Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3 class="link-text">Integrador</h3>
            <button class="toggle-btn"><i class="fas fa-bars"></i></button>
        </div>
        <div class="sidebar-content">
            <ul class="menu-links">
                <li>
                    <a href="#" id="nav-produtos">
                        <i class="fas fa-box-open"></i>
                        <span class="link-text">Produtos</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="submenu-toggle">
                        <i class="fas fa-cogs"></i>
                        <span class="link-text">Integrações</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#" id="nav-conexoes-erp"><span class="link-text">Conexões ERP</span></a></li>
                        <li><a href="#" id="nav-conexoes-fornecedores"><span class="link-text">Conexões Fornecedores</span></a></li>
                    </ul>
                </li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <button id="theme-toggle-btn" class="theme-toggle-btn" title="Alternar tema">
                <i class="fas fa-moon moon-icon"></i>
                <i class="fas fa-sun sun-icon"></i>
                <span class="link-text">Tema</span>
            </button>
        </div>
    </div>

    <main class="content">
        <header class="main-header">
            <h1 id="main-title">Bem-vindo ao Integrador ERP</h1>
        </header>
        <div id="page-content">
            <!-- Conteúdo das páginas será carregado aqui -->
            <!-- O container de toasts será criado e inserido aqui pelo ui.js -->
        </div>
    </main>

    <!-- Modal para Adicionar/Editar Conexões -->
    <div id="form-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title"></h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="modal-form"><div id="form-fields"></div></form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                <button type="submit" form="modal-form" class="btn btn-primary">Salvar</button>
            </div>
        </div>
    </div>

    <script src="ui.js?v=__CACHE_BUSTER__" defer></script>
</body>
</html>
