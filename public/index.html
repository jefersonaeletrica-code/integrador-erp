<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador A Elétrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6 md:p-10 text-gray-800">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-gray-900">Painel de Integração - A Elétrica</h1>
        
        <!-- Bloco 1: Configuração do Bling (OAuth) -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-xl font-semibold text-gray-700">1. Credenciais do Bling (ERP)</h2>
                <span id="badgeBling" class="px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-600">Desconectado</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="BLING_CLIENT_ID" placeholder="Client ID (Bling)" class="p-2.5 border rounded-lg text-sm">
                <input type="password" id="BLING_CLIENT_SECRET" placeholder="Client Secret (Bling)" class="p-2.5 border rounded-lg text-sm">
                <input type="text" id="BLING_REDIRECT_URI" placeholder="URL de Redirecionamento (/callback)" class="p-2.5 border rounded-lg text-sm md:col-span-2">
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="salvarConfigBling()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800">Salvar Bling</button>
                <button onclick="conectarBling()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-orange-700">Conectar / Autorizar Bling</button>
            </div>
        </div>

        <!-- Bloco 2: Configuração da Loja Virtual -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-4">
            <div class="border-b pb-3">
                <h2 class="text-xl font-semibold text-gray-700">2. Credenciais da Loja Virtual</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="LOJA_API_URL" placeholder="URL da API da Loja" class="p-2.5 border rounded-lg text-sm">
                <input type="password" id="LOJA_API_KEY" placeholder="Chave / Token da API da Loja" class="p-2.5 border rounded-lg text-sm">
            </div>
            <div class="pt-2">
                <button onclick="salvarConfigLoja()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800">Salvar Loja</button>
            </div>
        </div>
    </div>

    <script>
        // Carrega as configurações ao abrir a página
        fetch('/api/config').then(r => r.json()).then(data => {
            for(let key in data) {
                if(document.getElementById(key)) document.getElementById(key).value = data[key];
            }
            if(data.temTokenBling) {
                const badge = document.getElementById('badgeBling');
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700';
                badge.innerText = 'Conectado ao Bling';
            }
        });

        async function salvarConfigBling() {
            const payload = {
                BLING_CLIENT_ID: document.getElementById('BLING_CLIENT_ID').value,
                BLING_CLIENT_SECRET: document.getElementById('BLING_CLIENT_SECRET').value,
                BLING_REDIRECT_URI: document.getElementById('BLING_REDIRECT_URI').value
            };
            const res = await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            alert(data.mensagem);
        }

        async function salvarConfigLoja() {
            const payload = {
                LOJA_API_URL: document.getElementById('LOJA_API_URL').value,
                LOJA_API_KEY: document.getElementById('LOJA_API_KEY').value
            };
            const res = await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            alert(data.mensagem);
        }

        async function conectarBling() {
            const res = await fetch('/api/auth/bling');
            const data = await res.json();
            if(data.sucesso && data.url) {
                window.location.href = data.url;
            } else {
                alert('Erro ao gerar URL de autorização.');
            }
        }
    </script>
</body>
</html>
