<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador A Elétrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6">Gerenciador de Integração A Elétrica</h1>
        
        <form id="formConfig" class="grid grid-cols-2 gap-4">
            <input type="text" id="CLIENT_ID" placeholder="Client ID" class="p-2 border rounded">
            <input type="password" id="CLIENT_SECRET" placeholder="Client Secret" class="p-2 border rounded">
            <input type="text" id="REDIRECT_URI" placeholder="Redirect URI" class="p-2 border rounded col-span-2">
            <input type="text" id="LOJA_API_URL" placeholder="URL API Loja" class="p-2 border rounded">
            <input type="password" id="LOJA_API_KEY" placeholder="Token API Loja" class="p-2 border rounded">
            
            <div class="col-span-2 flex gap-4">
                <button type="button" onclick="salvarConfig()" class="bg-black text-white px-4 py-2 rounded">Salvar Credenciais</button>
                <button type="button" onclick="iniciarAuth()" class="bg-orange-600 text-white px-4 py-2 rounded">Conectar Bling</button>
            </div>
        </form>
    </div>

    <script>
        // Carrega configurações ao abrir
        fetch('/api/config').then(r => r.json()).then(data => {
            for(let key in data) {
                if(document.getElementById(key)) document.getElementById(key).value = data[key];
            }
        });

        async function salvarConfig() {
            const config = {
                CLIENT_ID: document.getElementById('CLIENT_ID').value,
                CLIENT_SECRET: document.getElementById('CLIENT_SECRET').value,
                REDIRECT_URI: document.getElementById('REDIRECT_URI').value,
                LOJA_API_URL: document.getElementById('LOJA_API_URL').value,
                LOJA_API_KEY: document.getElementById('LOJA_API_KEY').value
            };
            await fetch('/api/config', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(config) });
            alert('Configurações salvas no servidor!');
        }

        async function iniciarAuth() {
            const res = await fetch('/api/auth/bling');
            const data = await res.json();
            window.location.href = data.url;
        }
    </script>
</body>
</html>
