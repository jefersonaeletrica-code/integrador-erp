<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrador ERP</title>
    <link rel="stylesheet" href="style.css">
    <!-- Adicionando Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h3 class="link-text">Integrador</h3>
            <button class="toggle-btn"><i class="fas fa-bars"></i></button>
        </div>
        <div>
            <ul class="menu-links">
                <li>
                    <a href="#" id="nav-produtos">
                        <i class="fas fa-box-open"></i>
                        <span class="link-text">Produtos</span>
                    </a>
                </li>
                <li>
                    <a href="#" class="submenu-toggle">
                        <i class="fas fa-cogs"></i>
                        <span class="link-text">Integrações</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#" id="nav-conexoes-erp"><span class="link-text">Conexões ERP</span></a></li>
                        <li><a href="#" id="nav-conexoes-fornecedores"><span class="link-text">Conexões Fornecedores</span></a></li>
                    </ul>
                </li>
            </ul>
        </div>
        <div class="theme-switcher">
            <label class="theme-switch" for="theme-switch-checkbox">
                <input type="checkbox" id="theme-switch-checkbox" />
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <main class="content">
        <h1 id="main-title">Bem-vindo ao Integrador ERP</h1>
        <div id="page-content">
            <!-- Conteúdo das páginas será carregado aqui -->
        </div>
    </main>

    <!-- Modal para Adicionar/Editar Conexões -->
    <div id="form-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <h2 id="modal-title"></h2>
            <form id="modal-form">
                <div id="form-fields"></div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <button type="button" class="btn-secondary modal-cancel">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
</html>
