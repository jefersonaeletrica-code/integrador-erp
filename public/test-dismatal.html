<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Scraper - Dismatal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 960px;
        }
        .card {
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .product-card {
            display: flex;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .product-image-container {
            flex-shrink: 0;
            width: 150px;
            height: 150px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .product-details {
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Teste de Busca de Produtos - Dismatal</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label for="searchTerm" class="form-label">SKU do Produto</label>
                    <input type="text" class="form-control" id="searchTerm" placeholder="Digite o SKU para buscar...">
                </div>
                <button id="searchButton" class="btn btn-primary">Buscar Produto</button>
            </div>
        </div>

        <div id="loading" class="d-none text-center my-4">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Buscando...</span>
            </div>
            <p class="mt-2">Buscando produto, isso pode levar alguns segundos...</p>
        </div>

        <div id="results" class="mt-4"></div>
    </div>

    <script>
        const searchButton = document.getElementById('searchButton');
        const searchTermInput = document.getElementById('searchTerm');
        const loadingDiv = document.getElementById('loading');
        const resultsDiv = document.getElementById('results');
        const connectionId = new URLSearchParams(window.location.search).get('id') || 1;

        function displayResults(data) {
            resultsDiv.innerHTML = ''; // Limpa resultados anteriores

            if (!data.sucesso) {
                resultsDiv.innerHTML = `<div class="alert alert-danger"><strong>Erro:</strong> ${data.erro}</div>`;
                return;
            }

            if (data.produtos.length === 0) {
                resultsDiv.innerHTML = '<div class="alert alert-warning">Nenhum produto encontrado.</div>';
                return;
            }

            data.produtos.forEach(product => {
                const price = product.preco ? `R$ ${product.preco.toFixed(2)}` : 'Preço indisponível';
                const stock = product.estoque !== null ? `${product.estoque} em estoque` : 'Estoque indisponível';
                const image = product.imagens && product.imagens.length > 0 ? product.imagens[0] : 'https://via.placeholder.com/150';

                const productCard = `
                    <div class="card product-card shadow-sm">
                        <div class="product-image-container">
                            <img src="${image}" class="product-image" alt="Imagem do Produto">
                        </div>
                        <div class="card-body product-details">
                            <h5 class="card-title">${product.nome || 'Nome indisponível'}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">SKU: ${product.codigoFornecedor || product.sku}</h6>
                            <p class="card-text fs-4 fw-bold text-success">${price}</p>
                            <p class="card-text"><small class="text-muted">${stock}</small></p>
                        </div>
                    </div>
                `;
                resultsDiv.innerHTML += productCard;
            });
        }

        searchButton.addEventListener('click', async () => {
            const searchTerm = searchTermInput.value.trim();
            if (!searchTerm) {
                alert('Por favor, digite um SKU.');
                return;
            }

            loadingDiv.classList.remove('d-none');
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch(`/api/supplier-connections/${connectionId}/products`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ searchTerm })
                });
                const data = await response.json();
                displayResults(data); // Usa a nova função para renderizar os resultados
            } catch (error) {
                displayResults({ sucesso: false, erro: `Falha na comunicação com a API: ${error.message}` });
            } finally {
                loadingDiv.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
